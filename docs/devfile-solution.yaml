schemaVersion: 2.3.0
metadata:
  name: workshop-dotnet-kafka
  version: 1.0.0
  description: HomeGrid — home energy monitor with AMQ Streams, datasette, and live pricing
attributes:
  che-editor: vscode
components:
  - name: tools
    container:
      image: image-registry.openshift-image-registry.svc:5000/workspace-images/udi-rhel9:latest
      endpoints:
        - exposure: public
          name: grid-dashboard
          protocol: https
          targetPort: 8080
          path: /
      env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: localhost:9092
        - name: KAFKA_TOPIC
          value: meter-readings
        - name: KAFKA_GROUP_ID
          value: grid-dashboard
        - name: DOTNET_CLI_TELEMETRY_OPTOUT
          value: "1"
        - name: DOTNET_NOLOGO
          value: "1"
      volumeMounts:
        - name: nuget
          path: /home/user/.nuget
      cpuLimit: '2'
      cpuRequest: '500m'
      memoryLimit: '4Gi'
      memoryRequest: '2Gi'
      mountSources: true

  - name: nuget
    volume:
      size: 1G

  - name: kafka
    container:
      image: apache/kafka:3.9.0
      endpoints:
        - name: kafka-broker
          exposure: internal
          targetPort: 9092
      env:
        - name: KAFKA_NODE_ID
          value: "1"
        - name: KAFKA_PROCESS_ROLES
          value: broker,controller
        - name: KAFKA_LISTENERS
          value: PLAINTEXT://:9092,CONTROLLER://:9093
        - name: KAFKA_ADVERTISED_LISTENERS
          value: PLAINTEXT://localhost:9092
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: 1@localhost:9093
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: CONTROLLER
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"
        - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
          value: "false"
      cpuLimit: '1'
      memoryLimit: '1Gi'

  - name: datasette
    container:
      image: datasetteproject/datasette
      endpoints:
        - name: datasette
          exposure: internal
          targetPort: 8001
      command: ["sh", "-c", "datasette serve \"$PROJECT_SOURCE/data/\" --host 0.0.0.0 --port 8001"]
      cpuLimit: '500m'
      memoryLimit: '512Mi'
      mountSources: true

  - name: price-api
    container:
      image: image-registry.openshift-image-registry.svc:5000/workspace-images/electricity-price-api:latest
      endpoints:
        - name: price-api
          exposure: internal
          targetPort: 5000
      cpuLimit: '250m'
      memoryLimit: '256Mi'

commands:
  - id: 1-install
    exec:
      label: "1. Install dependencies"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "dotnet build HomeGrid.sln"
      group:
        kind: build
        isDefault: true
  - id: 2-start
    exec:
      label: "2. Start HomeGrid dashboard"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "dotnet run --project src/HomeGrid --urls http://0.0.0.0:8080"
      group:
        kind: run
        isDefault: true
  - id: 3-create-topic
    exec:
      label: "3. Create meter-readings topic"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "dotnet run --project src/HomeGrid.CreateTopic"
  - id: 4-produce
    exec:
      label: "4. Start meter reading producer"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: "dotnet run --project src/HomeGrid.Producer"
